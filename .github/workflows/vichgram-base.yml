name: VichGram base build

# Чистая база Telegram: сборка release-APK без секретов (подпись debug-ключом).
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/vichgram-base.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up ccache
        uses: Chocobo1/setup-ccache-action@v1
        with:
          remove_stale_cache: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;37.0.0 ndk;27.3.13750724 platforms;android-37.0 cmake;3.22.1"

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8' >> ~/.gradle/gradle.properties

      - name: Create google-services.json
        run: |
          PKG=$(sed -n 's/^APP_PACKAGE=//p' gradle.properties | tr -d '[:space:]')
          if [ -z "$PKG" ]; then PKG=tw.nekomimi.nekogram; fi
          cat > TMessagesProj_App/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "0",
              "project_id": "vichgram",
              "storage_bucket": "vichgram.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:0:android:0000000000000000000000",
                  "android_client_info": { "package_name": "PKGPLACEHOLDER" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          sed -i "s/PKGPLACEHOLDER/$PKG/" TMessagesProj_App/google-services.json
          python3 -c "import json;json.load(open('TMessagesProj_App/google-services.json'))"
          echo "google-services.json готов для пакета $PKG"

      - name: Configure local.properties
        env:
          SECRET_API_ID: ${{ secrets.API_ID || secrets.VICHGRAM_TG_API_ID }}
          SECRET_API_HASH: ${{ secrets.API_HASH || secrets.VICHGRAM_TG_API_HASH }}
          SECRET_MAPS_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          : > local.properties
          echo "apiId=${SECRET_API_ID:-0}" >> local.properties
          echo "apiHash=${SECRET_API_HASH}" >> local.properties
          echo "mapsApiKey=${SECRET_MAPS_KEY}" >> local.properties
          echo "helperBotId=0" >> local.properties
          echo "helperBotUsername=" >> local.properties
          echo "sentryDsn=" >> local.properties
          echo "--- local.properties (значения скрыты) ---"
          sed -E 's/^(apiHash|sentryDsn|mapsApiKey)=.*/\1=***/' local.properties

      - name: Disk before build
        run: df -h /

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Show results
        run: |
          df -h /
          find TMessagesProj_App/build/outputs/apk -name '*.apk' -printf '%p %s bytes\n' || true

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: vichgram-base-apk
          path: TMessagesProj_App/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vichgram-${{ github.run_number }}
          name: VichGram ${{ github.run_number }}
          body: |
            VichGram — сборка на базе Telegram (Nekogram) с переименованием и своей иконкой.
            Ключи API подставлены из секретов репозитория.
          prerelease: true
          files: TMessagesProj_App/build/outputs/apk/release/*.apk
